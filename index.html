<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TugasKu &mdash; Portal Pengumpulan Tugas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            drive: {
              blue: '#1a73e8',
              blueHover: '#1557bf',
              canvas: '#f8fafd',
              surface: '#ffffff',
              border: '#dadce0',
              text: '#202124',
              muted: '#5f6368',
              subtle: '#80868b',
            }
          }
        }
      }
    }
  </script>
  <script>
    try {
      const s = localStorage.getItem('pngumpul_session');
      if (s) window.location.replace('admin.html' + window.location.search + window.location.hash);
    } catch (e) {}
  </script>
  <style>
    body {
      background-color: #f8fafd;
      color: #202124;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-drive-blue selection:text-white">
  <main class="w-full max-w-sm bg-white border border-drive-border rounded-2xl p-7 text-center space-y-6 shadow-sm">
    
    <div class="flex items-center justify-center gap-3">
      <svg class="w-10 h-10 flex-shrink-0" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="#1a73e8" fill-opacity="0.1" />
        <path d="M11 13C11 11.8954 11.8954 11 13 11H18.2C19.0487 11 19.845 11.4118 20.3344 12.097L21.6656 13.903C22.155 14.5882 22.9513 15 23.8 15H27C28.1046 15 29 15.8954 29 17V26C29 27.1046 28.1046 28 27 28H13C11.8954 28 11 27.1046 11 26V13Z" fill="#FBBC04" />
        <path d="M12 17H28V26C28 27.1046 27.1046 28 26 28H14C12.8954 28 12 27.1046 12 26V17Z" fill="#F29900" />
        <circle cx="20" cy="22.5" r="3.2" fill="#FFFFFF" />
        <path d="M19 22.5H21M20 21.5V23.5" stroke="#1A73E8" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="text-left">
        <span class="text-xl font-extrabold tracking-tight text-drive-text block leading-tight">
          TugasKu
        </span>
        <span class="text-xs text-drive-muted font-medium">Panel Pengelolaan Guru</span>
      </div>
    </div>

    <div class="space-y-2.5 pt-1 text-sm font-semibold">
      <a
        href="admin.html"
        class="w-full block py-3 px-4 rounded-xl bg-drive-blue hover:bg-drive-blueHover text-white font-bold transition shadow-xs text-center"
      >
        Buka Drive Guru
      </a>
      <a
        href="login.html"
        class="w-full block py-2.5 px-4 rounded-xl bg-white hover:bg-gray-50 text-drive-text text-xs border border-drive-border transition text-center font-medium"
      >
        Halaman Masuk Akun Guru
      </a>
    </div>

    <p class="text-xs text-drive-subtle pt-2 border-t border-drive-border">
      Platform Terpadu Pengumpulan & Penilaian Tugas Sekolah
    </p>

  </main>
</body>
</html>
