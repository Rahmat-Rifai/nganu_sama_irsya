<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pngumpul &mdash; Masuk Panel Guru</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            app: {
              bg: '#0f0d14',
              surface: '#171320',
              surfaceElevated: '#201a2d',
              surfaceHover: '#29213a',
              border: '#2e263f',
              borderHover: '#463b5e',
              text: '#ffffff',
              body: '#ece6f2',
              muted: '#b2a8c0',
              subtle: '#7d738c',
              violet: '#B284BE',      // African Violet
              violetHover: '#c599d1',
              pastel: '#D4BBF0',      // Light Pastel Purple
              pale: '#F2E8FA',        // Pale Purple
              danger: '#ff8a80',
              success: '#81c995',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0f0d14;
      color: #ece6f2;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, #251b38 0%, #0f0d14 70%);
      background-attachment: fixed;
    }
    input:focus, button:focus-visible, a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px #0f0d14, 0 0 0 3px #B284BE;
    }
    .input-field {
      background-color: #120e1a;
      border: 1px solid #2e263f;
      color: #ffffff;
      transition: border-color 0.15s ease;
    }
    .input-field:focus {
      border-color: #B284BE;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 selection:bg-app-violet selection:text-app-bg antialiased">

  <!-- Top Minimal Nav -->
  <header class="w-full max-w-md mx-auto flex items-center justify-between py-3">
    <div class="flex items-center gap-2.5">
      <svg class="w-7 h-7 flex-shrink-0" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#1f182b"/>
        <circle cx="16" cy="16" r="10.5" stroke="#3d3254" stroke-width="1.2"/>
        <path d="M16 5.5C16 11.299 11.299 16 5.5 16C11.299 16 16 20.701 16 26.5C16 20.701 20.701 16 26.5 16C20.701 16 16 11.299 16 5.5Z" fill="#B284BE"/>
        <circle cx="16" cy="16" r="3" fill="#F2E8FA"/>
      </svg>
      <span class="text-base font-extrabold tracking-tight text-white">
        Pngumpul
      </span>
    </div>
    <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-app-surfaceElevated text-app-pastel border border-app-border">
      Panel Guru
    </span>
  </header>

  <!-- Login Console -->
  <main class="w-full max-w-sm mx-auto my-auto py-6">
    <div class="bg-app-surface border border-app-border rounded-xl p-6 sm:p-8 space-y-5 shadow-2xl">
      
      <div class="space-y-1">
        <h1 class="text-xl font-bold text-white tracking-tight">Masuk ke Panel Guru</h1>
        <p class="text-sm text-app-muted">Silakan masukkan akun pendidik Anda untuk melanjutkan.</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="login-identifier" class="block text-sm font-semibold text-white mb-1.5">
            Alamat Email atau NIP
          </label>
          <input
            type="text"
            id="login-identifier"
            name="identifier"
            required
            autocomplete="username"
            value="budi@sekolah.sch.id"
            placeholder="budi@sekolah.sch.id"
            class="input-field w-full px-3.5 py-2.5 text-sm rounded-lg font-medium"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-sm font-semibold text-white">
              Kata Sandi
            </label>
            <a href="#reset" onclick="alert('Silakan hubungi staf IT sekolah untuk mereset kata sandi akun Anda.')" class="text-xs text-app-pastel font-medium hover:underline">
              Lupa sandi?
            </a>
          </div>
          <div class="relative">
            <input
              type="password"
              id="login-password"
              name="password"
              required
              autocomplete="current-password"
              value="password123"
              class="input-field w-full pl-3.5 pr-10 py-2.5 text-sm rounded-lg font-medium"
            />
            <button
              type="button"
              id="toggle-password-btn"
              onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-app-muted hover:text-white"
              aria-label="Tampilkan sandi"
            >
              <svg id="eye-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3 px-4 rounded-lg bg-app-violet hover:bg-app-violetHover text-app-bg font-bold text-sm tracking-wide transition flex items-center justify-center gap-2 mt-2 shadow-sm"
        >
          <span id="submit-text">Masuk</span>
        </button>
      </form>

      <div id="feedback-notice" class="hidden p-2.5 rounded-lg border text-xs" role="status"></div>

      <!-- Quick Demo Trigger -->
      <div class="pt-3 border-t border-app-border flex items-center justify-between text-xs">
        <span class="text-app-muted font-medium">Akun Demo: Drs. Budi</span>
        <button
          type="button"
          onclick="fillDemo()"
          class="text-app-pastel font-bold hover:underline"
        >
          Isi Otomatis
        </button>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-md mx-auto text-center text-xs text-app-subtle py-3">
    Pngumpul &bull; Sistem Pengumpulan & Evaluasi Tugas Sekolah
  </footer>

  <script>
    function fillDemo() {
      document.getElementById('login-identifier').value = 'budi@sekolah.sch.id';
      document.getElementById('login-password').value = 'password123';
      showNotice('Akun pengujian dimuat.', 'info');
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
      } else {
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }

    function showNotice(msg, type) {
      const notice = document.getElementById('feedback-notice');
      notice.className = 'p-2.5 rounded-lg border text-xs';
      if (type === 'error') {
        notice.classList.add('bg-app-danger/10', 'border-app-danger/40', 'text-app-danger');
      } else if (type === 'success') {
        notice.classList.add('bg-app-success/10', 'border-app-success/40', 'text-app-success');
      } else {
        notice.classList.add('bg-app-surfaceElevated', 'border-app-border', 'text-white');
      }
      notice.textContent = msg;
      notice.classList.remove('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-identifier').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if (!id || !pass) return showNotice('Lengkapi email dan sandi.', 'error');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      document.getElementById('submit-text').textContent = 'Memverifikasi...';

      localStorage.setItem('pngumpul_session', JSON.stringify({
        name: 'Drs. Budi Santoso',
        nip: '197505122002121001',
        email: id,
        role: 'teacher',
        subjects: ['Pemrograman Web', 'Basis Data'],
        classes: ['X RPL 1', 'X RPL 2', 'XI RPL 1'],
        loginTime: new Date().toISOString()
      }));

      showNotice('Masuk berhasil.', 'success');
      setTimeout(() => window.location.href = 'admin.html', 250);
    }
  </script>
</body>
</html>
