<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TugasKu &mdash; Masuk Panel Guru</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            drive: {
              blue: '#1a73e8',
              blueHover: '#1557bf',
              canvas: '#f8fafd',
              surface: '#ffffff',
              border: '#dadce0',
              text: '#202124',
              muted: '#5f6368',
              subtle: '#80868b',
              danger: '#d93025',
              success: '#1e8e3e',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f8fafd;
      color: #202124;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    input:focus, button:focus-visible, a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-drive-blue selection:text-white">

  <!-- Top Minimal Nav -->
  <header class="w-full max-w-md mx-auto flex items-center justify-between py-3">
    <div class="flex items-center gap-2.5">
      <svg class="w-8 h-8 flex-shrink-0" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="#1a73e8" fill-opacity="0.1" />
        <path d="M11 13C11 11.8954 11.8954 11 13 11H18.2C19.0487 11 19.845 11.4118 20.3344 12.097L21.6656 13.903C22.155 14.5882 22.9513 15 23.8 15H27C28.1046 15 29 15.8954 29 17V26C29 27.1046 28.1046 28 27 28H13C11.8954 28 11 27.1046 11 26V13Z" fill="#FBBC04" />
        <path d="M12 17H28V26C28 27.1046 27.1046 28 26 28H14C12.8954 28 12 27.1046 12 26V17Z" fill="#F29900" />
        <circle cx="20" cy="22.5" r="3.2" fill="#FFFFFF" />
        <path d="M19 22.5H21M20 21.5V23.5" stroke="#1A73E8" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="flex flex-col">
        <span class="text-base font-extrabold tracking-tight text-drive-text leading-tight">
          TugasKu
        </span>
        <span class="text-[11px] text-drive-muted font-medium">
          Sistem Pengumpulan Tugas Sekolah
        </span>
      </div>
    </div>
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-drive-blue border border-blue-200">
      Panel Guru
    </span>
  </header>

  <!-- Login Card (Google Account Style) -->
  <main class="w-full max-w-sm mx-auto my-auto py-6">
    <div class="bg-white border border-drive-border rounded-2xl p-7 sm:p-8 space-y-6 shadow-sm">
      
      <div class="space-y-1">
        <h1 class="text-xl font-bold text-drive-text tracking-tight">Masuk Akun Guru</h1>
        <p class="text-xs text-drive-muted">Gunakan email pendidik atau NIP Anda untuk mengakses panel.</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="login-identifier" class="block text-xs font-semibold text-drive-text mb-1.5">
            Email Sekolah atau NIP Guru
          </label>
          <input
            type="text"
            id="login-identifier"
            name="identifier"
            required
            autocomplete="username"
            value="budi@sekolah.sch.id"
            placeholder="budi@sekolah.sch.id"
            class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-drive-border focus:border-drive-blue bg-white text-drive-text font-medium transition"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-semibold text-drive-text">
              Kata Sandi
            </label>
            <a href="#reset" onclick="alert('Silakan hubungi administrator IT sekolah untuk reset kata sandi.')" class="text-xs text-drive-blue font-medium hover:underline">
              Lupa sandi?
            </a>
          </div>
          <div class="relative">
            <input
              type="password"
              id="login-password"
              name="password"
              required
              autocomplete="current-password"
              value="password123"
              class="w-full pl-3.5 pr-10 py-2.5 text-sm rounded-lg border border-drive-border focus:border-drive-blue bg-white text-drive-text font-medium transition"
            />
            <button
              type="button"
              id="toggle-password-btn"
              onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-drive-muted hover:text-drive-text"
              aria-label="Tampilkan sandi"
            >
              <svg id="eye-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3 px-4 rounded-xl bg-drive-blue hover:bg-drive-blueHover text-white font-bold text-sm tracking-wide transition flex items-center justify-center gap-2 mt-2 shadow-xs active:scale-[0.99]"
        >
          <span id="submit-text">Buka Panel Guru</span>
        </button>
      </form>

      <div id="feedback-notice" class="hidden p-2.5 rounded-lg border text-xs" role="status"></div>

      <!-- Quick Demo Trigger -->
      <div class="pt-3 border-t border-drive-border flex items-center justify-between text-xs">
        <span class="text-drive-muted font-medium">Akun Demo: Drs. Budi</span>
        <button
          type="button"
          onclick="fillDemo()"
          class="text-drive-blue font-bold hover:underline"
        >
          Isi Otomatis
        </button>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-md mx-auto text-center text-xs text-drive-subtle py-3">
    TugasKu &bull; Sistem Pengumpulan & Evaluasi Tugas Sekolah Khusus Guru
  </footer>

  <script>
    function fillDemo() {
      document.getElementById('login-identifier').value = 'budi@sekolah.sch.id';
      document.getElementById('login-password').value = 'password123';
      showNotice('Akun pengujian guru dimuat.', 'info');
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
      } else {
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }

    function showNotice(msg, type) {
      const notice = document.getElementById('feedback-notice');
      notice.className = 'p-2.5 rounded-lg border text-xs';
      if (type === 'error') {
        notice.classList.add('bg-red-50', 'border-red-200', 'text-drive-danger');
      } else if (type === 'success') {
        notice.classList.add('bg-green-50', 'border-green-200', 'text-drive-success');
      } else {
        notice.classList.add('bg-blue-50', 'border-blue-200', 'text-drive-blue');
      }
      notice.textContent = msg;
      notice.classList.remove('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-identifier').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if (!id || !pass) return showNotice('Lengkapi email dan sandi.', 'error');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      document.getElementById('submit-text').textContent = 'Memverifikasi...';

      localStorage.setItem('pngumpul_session', JSON.stringify({
        name: 'Drs. Budi Santoso',
        nip: '197505122002121001',
        email: id,
        role: 'teacher',
        subjects: ['Pemrograman Web & PBO Lanjut', 'Produktif Kejuruan'],
        classes: ['XI RPL', 'XI DPIB', 'XI Animasi', 'XI TKR A', 'XI TKR B', 'XI TKR C', 'XI TSM A', 'XI TSM B', 'XI TSM C', 'XI PBS'],
        loginTime: new Date().toISOString()
      }));

      showNotice('Masuk berhasil. Membuka panel...', 'success');
      setTimeout(() => window.location.href = 'admin.html', 300);
    }
  </script>
</body>
</html>
