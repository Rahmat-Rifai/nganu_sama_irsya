<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pngumpul &mdash; Masuk Panel Guru</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              canvas: '#0c0a10',
              surface: '#14101b',
              surfaceElevated: '#1b1625',
              border: '#261f33',
              borderHover: '#3d3251',
              text: '#f6f3f9',
              muted: '#9f95ad',
              subtle: '#6b6378',
              violet: '#B284BE',      // African Violet
              violetHover: '#a16fab',
              pastel: '#BBA3D9',      // Light Pastel Purple
              pale: '#EDDAF2',        // Pale Purple
              danger: '#ff8a80',
              success: '#81c995',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0c0a10;
      color: #f6f3f9;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, #20172e 0%, #0c0a10 70%);
      background-attachment: fixed;
    }
    input:focus, button:focus-visible, a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px #0c0a10, 0 0 0 3px #B284BE;
    }
    .input-field {
      background-color: #0e0b14;
      border: 1px solid #261f33;
      color: #f6f3f9;
      transition: border-color 0.12s ease;
    }
    .input-field:focus {
      border-color: #B284BE;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 selection:bg-brand-violet selection:text-brand-canvas antialiased">

  <!-- Top Minimal Nav with Refined Flaticon Design Element Mark -->
  <header class="w-full max-w-4xl mx-auto flex items-center justify-between py-2">
    <div class="flex items-center gap-2.5">
      <!-- Flaticon Curvilinear Star Design Element -->
      <svg class="w-6 h-6 flex-shrink-0" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#171220"/>
        <circle cx="16" cy="16" r="10.5" stroke="#362d46" stroke-width="1"/>
        <path d="M16 5.5C16 11.299 11.299 16 5.5 16C11.299 16 16 20.701 16 26.5C16 20.701 20.701 16 26.5 16C20.701 16 16 11.299 16 5.5Z" fill="#B284BE"/>
        <circle cx="16" cy="16" r="2.75" fill="#EDDAF2"/>
      </svg>
      <span class="text-sm font-extrabold tracking-tight text-brand-text">
        Pngumpul
      </span>
    </div>
    <span class="text-[11px] font-mono text-brand-subtle uppercase tracking-wider">Akses Guru</span>
  </header>

  <!-- Login Console -->
  <main class="w-full max-w-sm mx-auto my-auto py-8">
    <div class="bg-brand-surface border border-brand-border rounded-xl p-6 sm:p-8 space-y-5 shadow-2xl">
      
      <div class="space-y-1">
        <h1 class="text-lg font-bold text-brand-text tracking-tight">Masuk Akun</h1>
        <p class="text-xs text-brand-muted">Portal evaluasi dan pengumpulan tugas pendidik.</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="login-identifier" class="block text-xs font-mono text-brand-muted mb-1">
            Email / NIP
          </label>
          <input
            type="text"
            id="login-identifier"
            name="identifier"
            required
            autocomplete="username"
            value="budi@sekolah.sch.id"
            placeholder="budi@sekolah.sch.id"
            class="input-field w-full px-3 py-2 text-xs rounded-lg font-medium"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="block text-xs font-mono text-brand-muted">
              Kata Sandi
            </label>
            <a href="#reset" onclick="alert('Hubungi admin IT sekolah untuk reset kata sandi.')" class="text-[11px] text-brand-pastel hover:underline">
              Lupa sandi?
            </a>
          </div>
          <div class="relative">
            <input
              type="password"
              id="login-password"
              name="password"
              required
              autocomplete="current-password"
              value="password123"
              class="input-field w-full pl-3 pr-9 py-2 text-xs rounded-lg font-medium"
            />
            <button
              type="button"
              id="toggle-password-btn"
              onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-brand-subtle hover:text-brand-text"
              aria-label="Tampilkan sandi"
            >
              <svg id="eye-icon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-2.5 px-4 rounded-lg bg-brand-violet hover:bg-brand-violetHover text-brand-canvas font-bold text-xs tracking-wide transition flex items-center justify-center gap-2 mt-2 shadow-sm"
        >
          <span id="submit-text">Masuk</span>
        </button>
      </form>

      <div id="feedback-notice" class="hidden p-2 rounded-lg border text-xs font-mono" role="status"></div>

      <!-- Quick Demo Trigger -->
      <div class="pt-3 border-t border-brand-border flex items-center justify-between text-xs">
        <span class="text-brand-subtle font-mono text-[11px]">Akun Uji: Drs. Budi</span>
        <button
          type="button"
          onclick="fillDemo()"
          class="text-brand-pastel hover:underline font-mono text-[11px]"
        >
          Isi Otomatis
        </button>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-4xl mx-auto text-center text-[11px] font-mono text-brand-subtle py-2">
    SMK Negeri 1 &bull; Jurusan RPL &bull; Pngumpul v1.2
  </footer>

  <script>
    function fillDemo() {
      document.getElementById('login-identifier').value = 'budi@sekolah.sch.id';
      document.getElementById('login-password').value = 'password123';
      showNotice('Akun pengujian dimuat.', 'info');
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
      } else {
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }

    function showNotice(msg, type) {
      const notice = document.getElementById('feedback-notice');
      notice.className = 'p-2 rounded-lg border text-xs font-mono';
      if (type === 'error') {
        notice.classList.add('bg-brand-danger/10', 'border-brand-danger/40', 'text-brand-danger');
      } else if (type === 'success') {
        notice.classList.add('bg-brand-success/10', 'border-brand-success/40', 'text-brand-success');
      } else {
        notice.classList.add('bg-brand-surfaceElevated', 'border-brand-border', 'text-brand-text');
      }
      notice.textContent = msg;
      notice.classList.remove('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-identifier').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if (!id || !pass) return showNotice('Lengkapi email dan sandi.', 'error');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      document.getElementById('submit-text').textContent = 'Memverifikasi...';

      localStorage.setItem('pngumpul_session', JSON.stringify({
        name: 'Drs. Budi Santoso',
        nip: '197505122002121001',
        email: id,
        role: 'teacher',
        subjects: ['Pemrograman Web', 'Basis Data'],
        classes: ['X RPL 1', 'X RPL 2', 'XI RPL 1'],
        loginTime: new Date().toISOString()
      }));

      showNotice('Masuk berhasil.', 'success');
      setTimeout(() => window.location.href = 'admin.html', 250);
    }
  </script>
</body>
</html>
